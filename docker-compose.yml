services:
  app:
    build: .
    image: mds-manager:${APP_VERSION:-latest}
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/mds.db
      MEDIA_DIR: /data/media  # фото салону — на постійному диску
      PUBLIC_URL: https://${DOMAIN}
    volumes:
      - ./data:/data
      - ./backups:/backups
    restart: unless-stopped
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2.8
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
