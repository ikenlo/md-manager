[project]
name = "mds-manager"
version = "0.1.0"
description = "AI-адміністратор салону M&D: Instagram Direct + Telegram, запис, нагадування"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiogram>=3.13",
    "anthropic>=0.40",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.5",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
