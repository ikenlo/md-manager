<style>
/* Макет MDS Manager на дизайн-системі MDS Connect (server/mds/web/static/style.css):

:root {
  --brand: #14392c; --brand-2: #1d4d3b; --brand-ink: #f5f1e6;
  --gold: #b48a3e; --gold-soft: #e8d4a6; --gold-tint: #f7efdc;

  --danger: #c2453d; --danger-bg: #fbe7e5; --info: #2f6fb3; --info-bg: #e6eef8;

  --shadow-sm: 0 1px 2px rgba(20, 30, 25, .06);

  --serif: "Cormorant Garamond", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1a15; --surface: #11241d; --surface-2: #142b23; --surface-3: #1a352b;
  --ink: #eeeae0; --ink-2: #c4c0b5; --ink-3: #8c897f; --line: #234236; --line-strong: #2d5242;
  --gold: #d2ab5f; --gold-tint: rgba(210, 171, 95, .14);
  --ok: #6fd0a0; --ok-bg: rgba(31, 138, 91, .18); --warn: #e8b660; --warn-bg: rgba(183, 121, 31, .2);
  --danger: #ef8d84; --danger-bg: rgba(194, 69, 61, .2); --info: #8fc1f5; --info-bg: rgba(47, 111, 179, .2);
  --prog: #c3a6f5; --prog-bg: rgba(124, 77, 204, .22); --link: #d2ab5f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1a15; --surface: #11241d; --surface-2: #142b23; --surface-3: #1a352b;
  --ink: #eeeae0; --ink-2: #c4c0b5; --ink-3: #8c897f; --line: #234236; --line-strong: #2d5242;
  --gold: #d2ab5f; --gold-tint: rgba(210, 171, 95, .14);
  --ok: #6fd0a0; --ok-bg: rgba(31, 138, 91, .18); --warn: #e8b660; --warn-bg: rgba(183, 121, 31, .2);
  --danger: #ef8d84; --danger-bg: rgba(194, 69, 61, .2); --info: #8fc1f5; --info-bg: rgba(47, 111, 179, .2);
  --prog: #c3a6f5; --prog-bg: rgba(124, 77, 204, .22); --link: #d2ab5f; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
.muted { color: var(--ink-3); } .small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }

.app { display: flex; min-height: 100vh; }
.sidebar { width: 240px; flex-shrink: 0; background: var(--brand); color: var(--brand-ink); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(145deg, #d8b46a, #a9823b); color: #1a1408; font: 700 13px var(--sans); }
.brand-name { font: 600 20px/1 var(--serif); color: #f3e6c4; }
.brand-sub { font-size: 11px; color: rgba(245, 241, 230, .55); letter-spacing: 1.6px; text-transform: uppercase; margin-top: 4px; }
.nav-group { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(245, 241, 230, .42); padding: 14px 12px 6px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; color: rgba(245, 241, 230, .78); font-weight: 600; font-size: 13px; margin-bottom: 1px; }
.nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav a.active { background: rgba(232, 212, 166, .14); color: #f3e6c4; box-shadow: inset 2px 0 0 var(--gold-soft); }
.nav a .cnt { margin-left: auto; background: #c2453d; color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; }
.nav a.ext { color: rgba(245, 241, 230, .6); }
.side-foot { margin-top: auto; padding: 12px 8px 4px; border-top: 1px solid rgba(255, 255, 255, .08); display: flex; align-items: center; gap: 10px; font-size: 13px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #8a5a2b; color: #fff; display: grid; place-items: center; font-weight: 700; }
.icon-btn { border: 0; background: transparent; color: inherit; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: rgba(127, 127, 127, .14); }

.main { flex: 1; min-width: 0; padding: 22px 28px 90px; max-width: 1360px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.topbar .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.demo { font-size: 12px; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
.tabbar { display: none; }
@media (max-width: 900px) {
  .sidebar { display: none; }
  .main { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: 20px; }
  .grid.kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-value { font-size: 20px; }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
  .tabbar a { flex: 1; text-align: center; color: var(--ink-3); font-size: 11px; font-weight: 600; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabbar a.active { color: var(--link); }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-sm); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 4px 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 12px; }
.grid.kpi { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.section { margin-top: 22px; } .section > h2 { margin-bottom: 10px; }
.kpi-tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.kpi-top { display: flex; align-items: center; gap: 8px; }
.kpi-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.kpi-value { font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi-tile.dark { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.kpi-tile.dark .kpi-label { color: rgba(245, 241, 230, .7); } .kpi-tile.dark .kpi-ico { background: rgba(255, 255, 255, .12); color: #f3e6c4; }
.kpi-tile.accent { border-color: rgba(180, 138, 62, .45); background: linear-gradient(180deg, var(--gold-tint), var(--surface) 70%); }
.kpi-tile.accent .kpi-ico { background: var(--gold); color: #fff; }
.delta { font-size: 12px; font-weight: 700; } .delta.up { color: var(--ok); } .delta.down { color: var(--danger); } .delta.flat { color: var(--ink-3); }
.kpi-tile.dark .delta.up { color: #8fe0b5; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; min-height: 40px; white-space: nowrap; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: linear-gradient(180deg, var(--brand-2), var(--brand)); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn.primary { background: var(--gold); border-color: var(--gold); color: #17120a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--gold); border-color: var(--gold); color: #17120a; } }
.btn.sm { min-height: 32px; padding: 4px 12px; font-size: 13px; border-radius: 8px; gap: 6px; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn:focus-visible, .seg button:focus-visible, a:focus-visible, .icon-btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; min-height: 32px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 30, 25, .1); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.danger { background: var(--danger-bg); color: var(--danger); } .chip.info { background: var(--info-bg); color: var(--info); }
.chip.prog { background: var(--prog-bg); color: var(--prog); } .chip.gold { background: var(--gold-tint); color: var(--gold); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; min-height: 40px; }
textarea { resize: vertical; line-height: 1.45; }
label.f > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }

.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; padding-bottom: 0; } .list-item:first-child { padding-top: 0; }
.ch { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-weight: 700; font-size: 12px; }
.ch.ig { background: linear-gradient(135deg, #f3b25a, #d6467a 55%, #7a4ad6); color: #fff; }
.ch.tg { background: #2aa0da; color: #fff; }
.callout { border-radius: 12px; padding: 12px 14px; background: var(--gold-tint); font-size: 13px; color: var(--ink-2); }
.pri { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
pre.p { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--ink-3); font-weight: 600; }

/* Діалоги: список + розмова */
.inbox { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1000px) { .inbox { grid-template-columns: minmax(0, 1fr); } }
.conv { display: flex; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
.conv:hover { background: var(--surface-2); } .conv.on { background: var(--gold-tint); border-color: rgba(180, 138, 62, .35); }
.conv .t { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat { display: flex; flex-direction: column; gap: 8px; padding: 6px 0 12px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 13.5px; }
.msg.in { background: var(--surface-3); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.ai { background: var(--ok-bg); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.sys { align-self: center; background: var(--danger-bg); color: var(--danger); font-size: 12px; font-weight: 600; border-radius: 999px; }
.msg .w { display: block; font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* Контент-план: календар місяця */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .wd { font-size: 11px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; text-align: center; padding: 4px 0; }

.cal .d b { font-size: 12px; color: var(--ink-3); }
.cal .post { font-size: 11.5px; font-weight: 600; padding: 3px 6px; border-radius: 6px; cursor: pointer; border: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post.reels { background: var(--prog-bg); color: var(--prog); } .post.carousel { background: var(--info-bg); color: var(--info); }
.post.post { background: var(--ok-bg); color: var(--ok); } .post.stories { background: var(--gold-tint); color: var(--gold); }
.post.sel { box-shadow: 0 0 0 2px var(--gold); }
.plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 12px; align-items: start; }
@media (max-width: 1100px) { .plan { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .cal { display: none; } .plan-list { display: block !important; } }
.plan-list { display: none; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 18px; }
.bars div { flex: 1; background: var(--line-strong); border-radius: 6px 6px 0 0; position: relative; min-width: 0; }
.bars div.hi { background: var(--gold); }

.bars-x { display: flex; gap: 6px; } .bars-x span { flex: 1; text-align: center; font-size: 11px; color: var(--ink-3); }
.switch { width: 42px; height: 24px; border-radius: 999px; background: var(--ok); position: relative; border: 0; cursor: pointer; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
.switch.off { background: var(--line-strong); } .switch.off::after { right: auto; left: 3px; }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .2s ease both; } @keyframes in { from { opacity: .4; transform: translateY(4px); } } }
</style>

      <div class="card"><div class="row"><span class="chip">${p[0]}.12 · 18:00</span><span class="post ${p[1]}" style="font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px">${FMT[p[1]]}</span><span class="chip info">Instagram + Facebook</span></div>
        <h3 style="margin:10px 0 2px;font:600 22px/1.2 var(--serif)">${esc(p[2])}</h3><div class="small muted">Рубрика: результати робіт · Заклик: запис у Direct</div>
        ${copy("pc", "Підпис і хештеги", `Було — стало ✨ ${p[2]}.\nМайстер підбирає відтінок і догляд саме під ваше волосся.\n\nЗапишіться в Direct або через Telegram-бота — покажемо вільні вікна.\n\n#салонкраси #фарбування #блонд #манікюр`)}
        ${copy("pi", "Промпт для зображення", "Before-and-after split of shoulder-length hair: left dull warm blonde, right cool glossy blonde, salon chair, soft daylight, green and gold interior, photorealistic, no text.")}
        ${copy("pv", "Промпт для відео", "Vertical 9:16, 9 seconds. Shot 1: client in salon chair, hair before, slow push-in. Shot 2: quick toning process close-up. Shot 3: hair flip reveal in daylight. Upbeat soft pop music.")}
        <div class="row" style="margin-top:12px"><button class="btn sm primary">${ic("image", "sm")}Згенерувати картинку</button><button class="btn sm">Позначити: опубліковано</button></div></div>
    </div>`;
  },

  generator: () => pageHead("Генератор", "Тексти й картинки для постів і реклами · Gemini (дешево) або Claude") + `
    <div class="grid two"><div class="card"><div class="seg" style="margin-bottom:12px"><button class="on">Підпис до поста</button><button>Оголошення</button><button>Картинка</button></div>
      <label class="f"><span>Про що</span><textarea id="task" rows="4">Пост про зимовий догляд за волоссям після фарбування, 3 поради, заклик записатися на догляд</textarea></label>
      <div class="row" style="margin-top:12px"><button class="btn primary">${ic("zap", "sm")}Згенерувати 3 варіанти</button><span class="muted small">≈ $0.002</span></div></div>
      <div class="card"><div class="card-head"><h3>Варіант 1 з 3</h3><div class="row"><button class="btn sm ghost">${ic("left", "sm")}</button><button class="btn sm ghost">${ic("right", "sm")}</button></div></div>
        ${copy("g1", "Текст", "Зима — випробування для фарбованого волосся ❄️\n\n1. Мийте теплою, а не гарячою водою.\n2. Раз на тиждень — маска з кератином.\n3. Не виходьте на мороз з вологим волоссям.\n\nА глибокий догляд зробимо в салоні: запис у Direct.")}</div></div>`,

  links: () => pageHead("Посилання з мітками", "Щоб бачити, з якої реклами чи поста прийшов клієнт", `<button class="btn primary">${ic("plus", "sm")}Нове посилання</button>`) + `
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Мітка</th><th>Де використано</th><th>Посилання</th><th class="r">Записи</th><th class="r">Прийшли</th><th class="r">Виручка</th></tr></thead><tbody>
      ${[["ig_ad_555", "Meta · «Блонд без жовтизни»", "t.me/md_salon_bot?start=ig_ad_555", 12, 9, "11 700 ₴"], ["gads_42", "Google · «Салон краси поруч»", "t.me/md_salon_bot?start=gads_42", 9, 8, "8 900 ₴"],
         ["bio", "Посилання в профілі Instagram", "t.me/md_salon_bot?start=bio", 21, 18, "16 400 ₴"], ["flyer_nov", "Листівки в ЖК «Сонячний»", "t.me/md_salon_bot?start=flyer_nov", 3, 2, "1 800 ₴"]]
        .map(([l, w, u, b, c, r]) => `<tr><td><span class="chip gold">${l}</span></td><td>${w}</td><td class="small muted">${u}</td><td class="r">${b}</td><td class="r">${c}</td><td class="r"><b>${r}</b></td></tr>`).join("")}
    </tbody></table></div></div>`,

  ai: () => pageHead("Витрати на AI", "Листопад · ліміт $30") + `
    <div class="grid kpi">${kpi("coins", "Витрачено", "$8.40", `<span class="muted small">з $30 · 28%</span>`, "dark")}${kpi("inbox", "Діалоги з клієнтами", "$5.10", `<span class="muted small">1 240 повідомлень</span>`)}
      ${kpi("trend", "AI-аналітик", "$1.90", `<span class="muted small">13 звітів</span>`)}${kpi("calendar", "Контент-план", "$0.40", `<span class="muted small">1 план</span>`)}${kpi("image", "Картинки", "$1.00", `<span class="muted small">29 шт.</span>`)}</div>`,

  setup: () => pageHead("Налаштування", "Бот, сповіщення й підключені сервіси") + `
    <div class="grid two"><div class="card"><div class="card-head"><h3>AI-адміністратор</h3></div>
      ${[["AI відповідає клієнтам", "Вимкніть — і всі нові повідомлення чекатимуть на вас у «Діалогах»", true], ["Щоденний звіт аналітика о 07:05", "Короткий підсумок приходить і в Telegram-групу", true], ["Контент-план 25-го числа", "На наступний місяць, 16 постів", true]]

           ["Meta: статистика й реклама", "Instagram, Facebook, Ads", "ok", "Оновлено о 06:30"], ["Google Ads", "Очікує developer token", "warn", "Не підключено"], ["Claude і Gemini", "AI для діалогів і контенту", "ok", "Працює"]]
          .map(([t, s, cl, st]) => `<div class="list-item"><div class="grow"><b>${t}</b><div class="small muted">${s}</div></div><span class="chip ${cl}"><span class="dot"></span>${st}</span></div>`).join("")}</div></div>`,
};

function render() {
  const route = (location.hash.replace("#", "") || "overview");
  const r = VIEWS[route] ? route : "overview";
  let g = "";
  document.getElementById("nav").innerHTML = NAV.map(([k, i, l, grp, cnt]) => {
    const head = grp !== g ? `<div class="nav-group">${(g = grp)}</div>` : "";
    return head + `<a href="#${k}" class="${k === r ? "active" : ""}">${ic(i)}<span>${l}</span>${cnt ? `<span class="cnt">${cnt}</span>` : ""}</a>`;
  }).join("") + `<div class="nav-group">Салон</div><a class="ext" href="#overview">${ic("ext")}<span>MDS Connect</span></a>`;
  document.getElementById("tabbar").innerHTML = TABS.map((k) => { const n = NAV.find((x) => x[0] === k); return `<a href="#${k}" class="${k === r ? "active" : ""}">${ic(n[1])}<span>${n[2]}</span></a>`; }).join("") +
    `<a href="#setup" class="${["ads", "generator", "links", "ai", "setup"].includes(r) ? "active" : ""}">${ic("more")}<span>Ще</span></a>`;
  const main = document.getElementById("main");
  main.innerHTML = `<div class="view">${VIEWS[r]()}</div>`;
}

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-copy]");
  if (c) {
    const el = document.getElementById(c.dataset.copy);
    const done = () => { c.textContent = "Скопійовано"; setTimeout(() => (c.textContent = "Копіювати"), 1500); };
    try { navigator.clipboard.writeText(el.textContent).then(done, () => { getSelection().selectAllChildren(el); }); } catch (_) { getSelection().selectAllChildren(el); }
    return;
  }
  const dl = e.target.closest("[data-dlg]"); if (dl) { selDialog = +dl.dataset.dlg; if (location.hash === "#dialogs") render(); return; }
  const p = e.target.closest("[data-post]"); if (p) { selPost = +p.dataset.post; render(); return; }
  const pr = e.target.closest("[data-period]"); if (pr) { period = pr.dataset.period; render(); return; }
  const sw = e.target.closest(".switch"); if (sw) sw.classList.toggle("off");
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter") { const dl = e.target.closest?.("[data-dlg]"); if (dl) dl.click(); } });

const themeBtn = document.getElementById("theme");
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function paintTheme() { themeBtn.innerHTML = ic(isDark() ? "sun" : "moon"); }
themeBtn.addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; paintTheme(); });
paintTheme();
window.addEventListener("hashchange", render);
render();
</script>
